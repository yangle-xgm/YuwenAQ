[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: 纯本地单元测试，不访问 Ollama（毫秒级）
    retrieval: 需要 Ollama 嵌入模型（bge-m3），秒级
    e2e: 端到端链路测试
    slow: 需要 LLM 生成，分钟级（默认跳过，加 -m slow 才跑）
filterwarnings =
    ignore::DeprecationWarning
